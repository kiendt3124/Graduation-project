version: '3.8'

services:
  app:
    image: vietkata09/graduation-project:latest
    container_name: graduation_app
    ports:
      - "127.0.0.1:8080:8080"   # Chỉ bind nội bộ, Nginx proxy vào
    environment:
      # Chỉ cần set DB_HOST, application.properties tự ghép URL
      # Các config còn lại dùng default trong application.properties
      - DB_HOST=postgres
      - SPRING_JPA_SHOW_SQL=false
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  postgres:
    image: postgres:16-alpine
    container_name: graduation_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: graduation_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d graduation_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Không expose port 5432 ra ngoài internet
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
