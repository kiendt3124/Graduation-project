spring.application.name=Graduation-project

# =============================================
# Reverse Proxy / Cloudflare Tunnel Support
# =============================================
# Cho phép Spring Boot đọc X-Forwarded-Proto header từ Cloudflare
# Giúp Swagger UI dùng https:// thay vì http://
server.forward-headers-strategy=native

# =============================================
# CORS
# =============================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://sbltsena.me,https://www.sbltsena.me}

# =============================================
# PostgreSQL Database Configuration
# =============================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/graduation_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# =============================================
# JPA / Hibernate
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =============================================
# JWT & Google OAuth2
# =============================================
jwt.key=${JWT_KEY:6gj3ijzRCKoZBfMWDghcHzAxjCcH4Kb7Z1XSzsBZM4z}
