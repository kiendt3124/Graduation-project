spring.application.name=Graduation-project

# =============================================
# Reverse Proxy / Cloudflare Tunnel Support
# =============================================
# Cho phép Spring Boot đọc X-Forwarded-Proto header từ Cloudflare
# Giúp Swagger UI dùng https:// thay vì http://
server.forward-headers-strategy=native

# =============================================
# CORS
# =============================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://sbltsena.me,https://www.sbltsena.me}

# =============================================
# PostgreSQL Database Configuration
# =============================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/graduation_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# =============================================
# JPA / Hibernate
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# =============================================
# JWT & Google OAuth2
# =============================================
jwt.key=${JWT_KEY:6gj3ijzRCKoZBfMWDghcHzAxjCcH4Kb7Z1XSzsBZM4z}
google.client.id=${GOOGLE_CLIENT_ID:547880381048-lau7t5mle81d9ba1o0ed532c3qthmfam.apps.googleusercontent.com}

# =============================================
# SePay Webhook
# =============================================
# Lấy API Key tại: https://my.sepay.vn > Tài khoản > API
sepay.api-key=${SEPAY_API_KEY:}

# =============================================
# Thông tin Vietinbank nhận tiền
# =============================================
bank.account-number=${BANK_ACCOUNT_NUMBER:109875532460}
bank.account-name=${BANK_ACCOUNT_NAME:TRUONG MINH VIET}
bank.name=Vietinbank

# =============================================
# Cấu hình gói Premium
# =============================================
premium.price.monthly=49000
premium.price.yearly=399000
premium.order-expiry-minutes=30
