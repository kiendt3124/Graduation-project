<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Google Login API</title>
  <script src="https://accounts.google.com/gsi/client" async></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 680px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 6px;
      background: linear-gradient(90deg, #6ee7f7, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 28px;
    }

    .card {
      background: #1a1a2e;
      border: 1px solid #2a2a45;
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .card h2 {
      font-size: 0.95rem;
      font-weight: 600;
      color: #a78bfa;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .step-badge {
      background: #a78bfa22;
      color: #a78bfa;
      border: 1px solid #a78bfa44;
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 0.75rem;
    }

    /* Google Sign-In button wrapper */
    #google-btn-wrap {
      display: flex;
      justify-content: flex-start;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 6px;
      margin-top: 14px;
    }

    input, textarea {
      width: 100%;
      background: #0f0f1a;
      border: 1px solid #2a2a45;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 0.82rem;
      padding: 10px 12px;
      font-family: 'Courier New', monospace;
      transition: border-color 0.2s;
      resize: vertical;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #a78bfa;
    }

    .row {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 10px 18px;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #6ee7f7, #a78bfa);
      color: #0f0f1a;
      flex: 1;
    }

    .btn-primary:hover { opacity: 0.85; transform: translateY(-1px); }

    .btn-secondary {
      background: #2a2a45;
      color: #ccc;
    }

    .btn-secondary:hover { background: #333360; }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      margin-top: 10px;
      min-height: 22px;
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot-idle     { background: #555; }
    .dot-loading  { background: #facc15; animation: pulse 1s infinite; }
    .dot-success  { background: #4ade80; }
    .dot-error    { background: #f87171; }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    .response-box {
      background: #0a0a14;
      border: 1px solid #2a2a45;
      border-radius: 10px;
      padding: 16px;
      font-family: 'Courier New', monospace;
      font-size: 0.8rem;
      line-height: 1.6;
      min-height: 80px;
      white-space: pre-wrap;
      word-break: break-all;
      color: #ccc;
    }

    .response-box.success { border-color: #4ade8055; color: #4ade80; }
    .response-box.error   { border-color: #f8717155; color: #f87171; }

    .token-display {
      font-size: 0.75rem;
      color: #6ee7f7;
      word-break: break-all;
      font-family: 'Courier New', monospace;
      background: #0a0a14;
      border-radius: 8px;
      padding: 10px;
      margin-top: 10px;
      border: 1px dashed #2a2a45;
      max-height: 80px;
      overflow-y: auto;
    }

    .chip {
      display: inline-block;
      background: #4ade8022;
      border: 1px solid #4ade8055;
      color: #4ade80;
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 0.75rem;
      margin-top: 8px;
    }

    .api-url {
      font-size: 0.78rem;
      color: #6ee7f7;
      font-family: 'Courier New', monospace;
      background: #0a0a14;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #2a2a45;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🔐 Test Google Login API</h1>
  <p class="subtitle">Đăng nhập Google → lấy ID Token → gọi backend tự động</p>

  <!-- STEP 1: Google Sign In -->
  <div class="card">
    <h2><span class="step-badge">Bước 1</span> Đăng nhập với Google</h2>
    <div id="google-btn-wrap">
      <div id="g_id_onload"
           data-client_id="547880381048-lau7t5mle81d9ba1o0ed532c3qthmfam.apps.googleusercontent.com"
           data-callback="handleCredentialResponse"
           data-auto_prompt="false">
      </div>
      <div class="g_id_signin"
           data-type="standard"
           data-size="large"
           data-theme="filled_blue"
           data-text="sign_in_with"
           data-shape="rectangular"
           data-logo_alignment="left">
      </div>
    </div>

    <div id="token-section" style="display:none">
      <span class="chip">✅ Đã lấy được ID Token</span>
      <div class="token-display" id="token-preview"></div>
    </div>
  </div>

  <!-- STEP 2: Gọi API -->
  <div class="card">
    <h2><span class="step-badge">Bước 2</span> Gọi API Backend</h2>

    <div class="api-url">POST http://localhost:8080/google</div>

    <label>Backend URL (có thể đổi nếu dùng port khác)</label>
    <input type="text" id="backend-url" value="http://localhost:8080/google" />

    <label>ID Token (tự động điền sau khi đăng nhập Google bên trên)</label>
    <textarea id="id-token-input" rows="3" placeholder="ID Token sẽ được tự động điền sau khi đăng nhập..."></textarea>

    <div class="row">
      <button class="btn-primary" onclick="callApi()">🚀 Gửi Request</button>
      <button class="btn-secondary" onclick="clearAll()">🗑 Clear</button>
    </div>

    <div class="status-bar">
      <div class="dot dot-idle" id="status-dot"></div>
      <span id="status-text">Chờ...</span>
    </div>
  </div>

  <!-- STEP 3: Response -->
  <div class="card">
    <h2><span class="step-badge">Bước 3</span> Response từ Backend</h2>
    <div class="response-box" id="response-box">Response sẽ hiện ở đây...</div>
  </div>
</div>

<script>
  let idToken = null;

  function handleCredentialResponse(response) {
    idToken = response.credential;

    // Hiển thị token (rút gọn)
    document.getElementById('token-section').style.display = 'block';
    document.getElementById('token-preview').textContent =
      idToken.substring(0, 60) + '...' + idToken.substring(idToken.length - 20);

    // Auto fill vào textarea
    document.getElementById('id-token-input').value = idToken;

    setStatus('success', '✅ Đã đăng nhập Google, sẵn sàng gửi lên backend!');
  }

  async function callApi() {
    const url = document.getElementById('backend-url').value.trim();
    const token = document.getElementById('id-token-input').value.trim();

    if (!token) {
      setStatus('error', '❌ Chưa có ID Token! Hãy đăng nhập Google trước.');
      return;
    }

    setStatus('loading', '⏳ Đang gửi request...');
    setResponse('neutral', 'Đang chờ response...');

    try {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ idToken: token })
      });

      const data = await res.json();
      const pretty = JSON.stringify(data, null, 2);

      if (res.ok) {
        setStatus('success', `✅ Thành công! HTTP ${res.status}`);
        setResponse('success', pretty);
      } else {
        setStatus('error', `❌ Lỗi HTTP ${res.status}`);
        setResponse('error', pretty);
      }
    } catch (err) {
      setStatus('error', '❌ Không kết nối được backend. Server đang chạy chưa?');
      setResponse('error', err.message);
    }
  }

  function clearAll() {
    document.getElementById('id-token-input').value = '';
    document.getElementById('response-box').textContent = 'Response sẽ hiện ở đây...';
    document.getElementById('response-box').className = 'response-box';
    document.getElementById('token-section').style.display = 'none';
    setStatus('idle', 'Chờ...');
    idToken = null;
  }

  function setStatus(type, msg) {
    const dot = document.getElementById('status-dot');
    const text = document.getElementById('status-text');
    dot.className = 'dot dot-' + (type === 'success' ? 'success' : type === 'error' ? 'error' : type === 'loading' ? 'loading' : 'idle');
    text.textContent = msg;
  }

  function setResponse(type, content) {
    const box = document.getElementById('response-box');
    box.textContent = content;
    box.className = 'response-box' + (type === 'success' ? ' success' : type === 'error' ? ' error' : '');
  }
</script>

</body>
</html>
